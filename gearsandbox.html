<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>齒輪沙盒 | Gear Interactive Lab</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Orbitron -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            tech: ['Orbitron', 'sans-serif'],
          },
          colors: {
            space: { 900: '#060813' },
          },
        },
      },
    };
  </script>

  <style>
    /* =========================================
       整頁固定為一個螢幕高度，不產生頁面捲軸
       (100dvh 會扣掉 iPad Safari 的網址列/工具列)
       ========================================= */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none; /* 防止 iPad 橡皮筋回彈與下拉重整 */
    }
    body {
      height: 100vh;   /* 舊版瀏覽器後備 */
      height: 100dvh;
      background-color: #020617;
      color: #e2e8f0;
      -webkit-text-size-adjust: 100%;
    }
    #root { height: 100%; }

    /* 隱藏捲軸 (內容仍可用手指滑動，但不顯示捲軸) */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* 畫布上的拖曳不觸發頁面捲動或縮放 */
    #gearCanvas { touch-action: none; }

    /* 手轉模式：齒輪卡死轉不動時左右抖動 */
    @keyframes gear-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .gear-shake { animation: gear-shake 0.4s; }
  </style>

  <!-- React 18 與 htm（htm 讓我們不需要編譯就能用類似 HTML 的寫法描述畫面） -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
</head>

<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, useCallback } = React;
    const html = htm.bind(React.createElement);

    /* ============================================================
     * 1. 可調整的參數
     * ============================================================ */
    const MODULE = 2.5;        // 模數：節圓半徑 = 齒數 × MODULE（同模數的齒輪才能正確嚙合）
    const ADDENDUM = 4.5;      // 齒頂高
    const DEDENDUM = 5;        // 齒根高（比齒頂高略大，保留間隙）
    const MIN_TEETH = 8;       // 齒數下限
    const MAX_TEETH = 48;      // 齒數上限
    const MESH_TOL = 3;        // 判定「嚙合」的距離容許誤差
    const SNAP_DIST = 18;      // 放開齒輪時，距離多近會自動吸附
    const AXLE_DIST = 2;       // 兩齒輪中心距離小於此值，視為同軸
    const GRID = 20;           // 格線間距
    const ASPECT = 0.6;        // 畫布 viewBox 的高 / 寬
    const STORAGE_KEY = 'gear-sandbox-v2';  // 瀏覽器自動儲存用的名稱

    // 工具列上的「新增齒輪」按鈕
    const PALETTE = [
      { teeth: 10, label: '迷你', color: 'text-emerald-400' },
      { teeth: 12, label: '小',   color: 'text-cyan-400' },
      { teeth: 18, label: '中',   color: 'text-blue-400' },
      { teeth: 24, label: '大',   color: 'text-indigo-400' },
      { teeth: 36, label: '特大', color: 'text-violet-400' },
    ];

    // 預設的顯示選項
    const DEFAULT_OPTS = { showLabels: true, showArrows: true, showLinks: false, gridSnap: false };

    /* ============================================================
     * 2. 小工具函式
     * ============================================================ */
    const radiusOf = (teeth) => teeth * MODULE;
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const uid = () => Math.random().toString(36).slice(2, 9);
    const fmt = (v, digits = 2) => (Math.abs(v) < 1e-9 ? '0' : v.toFixed(digits));

    /**
     * 建立一個齒輪物件
     * layer：0 = 前層、1 = 後層（同軸複合齒輪用）
     * angle：目前轉角（弧度）
     */
    function makeGear(teeth, x, y, layer = 0, isMotor = false) {
      return { id: isMotor ? 'motor' : uid(), teeth, x, y, layer, isMotor, angle: 0 };
    }

    /* ============================================================
     * 3. 齒輪外形
     * ============================================================ */

    // 齒形路徑：每顆齒的中心位於角度 0、pitch、2·pitch …（每種齒數只算一次）
    const pathCache = new Map();
    function gearPath(teeth) {
      if (pathCache.has(teeth)) return pathCache.get(teeth);
      const r = radiusOf(teeth);
      const outer = r + ADDENDUM;
      const inner = r - DEDENDUM;
      const pitch = (Math.PI * 2) / teeth;
      // 一顆齒的輪廓：[在一個齒距中的位置, 半徑]
      const profile = [[-0.3, inner], [-0.13, outer], [0.13, outer], [0.3, inner]];
      const points = [];
      for (let i = 0; i < teeth; i++) {
        for (const [f, rad] of profile) {
          const a = (i + f) * pitch;
          points.push(`${(rad * Math.cos(a)).toFixed(2)} ${(rad * Math.sin(a)).toFixed(2)}`);
        }
      }
      const d = `M ${points.join(' L ')} Z`;
      pathCache.set(teeth, d);
      return d;
    }

    // 轉向箭頭（畫的是順時針版本；逆時針時用 scale(-1,1) 左右鏡射）
    const arrowCache = new Map();
    function arrowPath(teeth) {
      if (arrowCache.has(teeth)) return arrowCache.get(teeth);
      const R = radiusOf(teeth) + ADDENDUM + 9;
      const a1 = (-150 * Math.PI) / 180;   // 弧線起點
      const a2 = (-30 * Math.PI) / 180;    // 弧線終點（箭頭位置）
      const sx = R * Math.cos(a1), sy = R * Math.sin(a1);
      const ex = R * Math.cos(a2), ey = R * Math.sin(a2);
      const tx = -Math.sin(a2), ty = Math.cos(a2);   // 順時針切線方向
      const nx = Math.cos(a2),  ny = Math.sin(a2);   // 法線方向
      const p = (x, y) => `${x.toFixed(1)} ${y.toFixed(1)}`;
      const result = {
        arc: `M ${p(sx, sy)} A ${R} ${R} 0 0 1 ${p(ex, ey)}`,
        head: `M ${p(ex + tx * 8, ey + ty * 8)} L ${p(ex + nx * 5, ey + ny * 5)} L ${p(ex - nx * 5, ey - ny * 5)} Z`,
      };
      arrowCache.set(teeth, result);
      return result;
    }

    /* ============================================================
     * 4. 傳動分析（哪些齒輪咬在一起、誰帶動誰、有沒有卡死）
     * ============================================================ */

    /**
     * 分析傳動關係。rootId = 從哪一顆齒輪開始推算（預設是馬達；手轉時是被手轉的那顆）
     * 每次齒輪被新增、移動、刪除時呼叫一次，回傳：
     *  nodes：每個齒輪的狀態（是否被帶動、轉速倍率、父齒輪…）
     *  links：所有嚙合 / 同軸的連接
     *  order：從馬達往外的順序，用來逐級推算角度
     *  jam / clash：是否有卡死、干涉
     */
    function computeTopology(gears, rootId = null) {
      const byId = new Map(gears.map(g => [g.id, g]));
      const nodes = new Map();
      const adj = new Map();   // 鄰接表：每個齒輪連到哪些齒輪

      gears.forEach(g => {
        nodes.set(g.id, {
          driven: false,   // 是否由馬達帶動
          frozen: false,   // 所在傳動系統因卡死 / 干涉而停止
          jammed: false,   // 卡死
          clashed: false,  // 與其他齒輪重疊
          ratio: 0,        // 角速度相對於馬達的倍率（正負號代表轉向）
          parent: null,    // 帶動它的齒輪
          kind: null,      // 'mesh' 嚙合 或 'axle' 同軸
          k: 0,            // 與父齒輪的角速度比
          a0Self: 0,       // 嚙合相位基準（自身）
          a0Parent: 0,     // 嚙合相位基準（父齒輪）
          offset: 0,       // 同軸時與父齒輪的角度差
        });
        adj.set(g.id, []);
      });

      // (1) 兩兩檢查：嚙合、干涉或同軸
      const links = [];
      let clash = false;
      for (let i = 0; i < gears.length; i++) {
        for (let j = i + 1; j < gears.length; j++) {
          const a = gears[i], b = gears[j];
          const d = Math.hypot(b.x - a.x, b.y - a.y);

          if (a.layer === b.layer) {
            const ideal = radiusOf(a.teeth) + radiusOf(b.teeth);   // 剛好嚙合的中心距
            if (d < ideal - MESH_TOL) {
              nodes.get(a.id).clashed = true;
              nodes.get(b.id).clashed = true;
              clash = true;
            } else if (d <= ideal + MESH_TOL) {
              adj.get(a.id).push({ g: b, kind: 'mesh' });
              adj.get(b.id).push({ g: a, kind: 'mesh' });
              links.push({ a: a.id, b: b.id, kind: 'mesh' });
            }
          } else if (d < AXLE_DIST) {
            adj.get(a.id).push({ g: b, kind: 'axle' });
            adj.get(b.id).push({ g: a, kind: 'axle' });
            links.push({ a: a.id, b: b.id, kind: 'axle' });
          }
        }
      }

      // (2) 從起點（馬達或手轉的齒輪）做廣度優先搜尋，建立「誰帶動誰」的傳動樹
      const order = [];
      let jam = false;
      const start = rootId ? byId.get(rootId) : gears.find(g => g.isMotor);

      if (start) {
        const root = nodes.get(start.id);
        root.driven = true;
        root.ratio = 1;
        const visited = new Set([start.id]);
        const queue = [start];

        while (queue.length) {
          const cur = queue.shift();
          const curNode = nodes.get(cur.id);

          for (const { g: nb, kind } of adj.get(cur.id)) {
            // 嚙合：轉向相反，轉速比 = 主動齒數 / 從動齒數；同軸：轉速相同
            const k = kind === 'mesh' ? -cur.teeth / nb.teeth : 1;
            const expected = curNode.ratio * k;
            const nn = nodes.get(nb.id);

            if (!visited.has(nb.id)) {
              visited.add(nb.id);
              Object.assign(nn, { driven: true, ratio: expected, parent: cur.id, kind, k });
              if (kind === 'mesh') {
                // 讓父齒輪的「齒」正對子齒輪的「齒溝」，畫面上才會真的咬合
                const theta = Math.atan2(nb.y - cur.y, nb.x - cur.x);
                nn.a0Parent = theta;
                nn.a0Self = theta + Math.PI - Math.PI / nb.teeth;
              } else {
                nn.offset = nb.angle - cur.angle;
              }
              order.push(nb.id);
              queue.push(nb);
            } else if (Math.abs(nn.ratio - expected) > 1e-6) {
              jam = true;   // 同一個齒輪收到互相衝突的轉速 / 轉向 → 卡死
            }
          }
        }

        // (3) 卡死或有干涉時，整個傳動系統停止
        const componentClashed = [...visited].some(id => nodes.get(id).clashed);
        if (jam || componentClashed) {
          visited.forEach(id => {
            const n = nodes.get(id);
            n.frozen = true;
            if (jam) n.jammed = true;
          });
        }
      }

      return { nodes, links, order, byId, jam, clash };
    }

    /**
     * 依傳動樹，從馬達往外推算每個齒輪的角度
     * （用公式直接算出角度，而不是各自累加，所以齒永遠對齊）
     */
    function applyKinematics(topo) {
      for (const id of topo.order) {
        const n = topo.nodes.get(id);
        if (n.frozen || !n.parent) continue;
        const g = topo.byId.get(id);
        const p = topo.byId.get(n.parent);
        if (!g || !p) continue;
        g.angle = n.kind === 'mesh'
          ? n.a0Self + n.k * (p.angle - n.a0Parent)
          : p.angle + n.offset;
      }
    }

    /* ============================================================
     * 5. 範例情境
     * ============================================================ */
    const R = radiusOf;
    const PRESETS = [
      {
        name: '基本嚙合',
        desc: '兩齒輪反向轉動，轉速與齒數成反比',
        build: () => [makeGear(14, 350, 300, 0, true), makeGear(28, 350 + R(14) + R(28), 300)],
      },
      {
        name: '惰輪',
        desc: '中間的惰輪只改變轉向，不改變總傳動比',
        build: () => {
          const m = makeGear(14, 260, 300, 0, true);
          const a = makeGear(10, m.x + R(14) + R(10), 300);
          const b = makeGear(24, a.x + R(10) + R(24), 300);
          return [m, a, b];
        },
      },
      {
        name: '齒輪串列',
        desc: '相鄰齒輪的轉向一路交替',
        build: () => {
          const list = [makeGear(14, 200, 300, 0, true)];
          [18, 12, 24, 10, 18].forEach(t => {
            const prev = list[list.length - 1];
            list.push(makeGear(t, prev.x + R(prev.teeth) + R(t), 300));
          });
          return list;
        },
      },
      {
        name: '複合減速',
        desc: '後層小齒輪與前層大齒輪同軸，減速比相乘',
        build: () => {
          const m = makeGear(12, 220, 320, 0, true);
          const a = makeGear(36, m.x + R(12) + R(36), 320);
          const b = makeGear(12, a.x, a.y, 1);              // 與 a 同軸、放在後層
          const c = makeGear(36, b.x + R(12) + R(36), 320, 1);
          return [m, a, b, c];
        },
      },
      {
        name: '放射排列',
        desc: '一個主動輪同時帶動多個齒輪',
        build: () => {
          const m = makeGear(16, 500, 300, 0, true);
          const list = [m];
          [0, 90, 180, 270].forEach(deg => {
            const a = (deg * Math.PI) / 180;
            const d = R(16) + R(18);
            list.push(makeGear(18, m.x + d * Math.cos(a), m.y + d * Math.sin(a)));
          });
          return list;
        },
      },
      {
        name: '三角迴路（卡死）',
        desc: '奇數個齒輪圍成一圈，轉向衝突而卡死',
        build: () => {
          const d = R(14) * 2;
          return [
            makeGear(14, 460, 340, 0, true),
            makeGear(14, 460 + d, 340),
            makeGear(14, 460 + d / 2, 340 - d * Math.sin(Math.PI / 3)),
          ];
        },
      },
    ];

    /* ============================================================
     * 6. 自動儲存 / 讀取（存在瀏覽器的 localStorage）
     * ============================================================ */
    function loadState() {
      const defaults = {
        gears: [makeGear(14, 300, 300, 0, true), makeGear(24, 300 + R(14) + R(24), 300)],
        rpm: 12,
        dir: 1,
        opts: DEFAULT_OPTS,
      };
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults;
        const data = JSON.parse(raw);

        // 檢查資料是否完整，並確保只有一個馬達
        let hasMotor = false;
        const gears = (Array.isArray(data.gears) ? data.gears : [])
          .filter(g => g && Number.isFinite(g.x) && Number.isFinite(g.y) && Number.isFinite(g.teeth))
          .map(g => {
            const isMotor = !!g.isMotor && !hasMotor;
            if (isMotor) hasMotor = true;
            return {
              id: isMotor ? 'motor' : String(g.id || uid()),
              teeth: clamp(Math.round(g.teeth), MIN_TEETH, MAX_TEETH),
              x: g.x,
              y: g.y,
              layer: g.layer === 1 ? 1 : 0,
              isMotor,
              angle: 0,
            };
          });
        if (!hasMotor) gears.unshift(makeGear(14, 300, 300, 0, true));

        return {
          gears,
          rpm: Number.isFinite(data.rpm) ? clamp(data.rpm, 0, 60) : defaults.rpm,
          dir: data.dir === -1 ? -1 : 1,
          opts: { ...DEFAULT_OPTS, ...(data.opts || {}) },
        };
      } catch {
        return defaults;   // 無痕模式等無法讀取時，使用預設值
      }
    }

    // 計算能剛好看到所有齒輪的畫面範圍
    function fitView(gears) {
      if (!gears.length) return { x: 0, y: 0, w: 1000 };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      gears.forEach(g => {
        const r = radiusOf(g.teeth) + 30;
        minX = Math.min(minX, g.x - r); maxX = Math.max(maxX, g.x + r);
        minY = Math.min(minY, g.y - r); maxY = Math.max(maxY, g.y + r);
      });
      const w = clamp(Math.max(maxX - minX + 160, (maxY - minY + 160) / ASPECT, 700), 300, 3000);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      return { x: cx - w / 2, y: cy - (w * ASPECT) / 2, w };
    }

    /* ============================================================
     * 7. 圖示（線條 SVG，取代外部圖示套件）
     * ============================================================ */
    const ICONS = {
      cog:      ['M12 4.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15z', 'M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
                 'M12 2v2.5', 'M12 19.5V22', 'M2 12h2.5', 'M19.5 12H22',
                 'M4.9 4.9l1.8 1.8', 'M17.3 17.3l1.8 1.8', 'M4.9 19.1l1.8-1.8', 'M17.3 6.7l1.8-1.8'],
      plus:     ['M12 5v14', 'M5 12h14'],
      trash:    ['M3 6h18', 'M8 6V4h8v2', 'M19 6l-1 14H6L5 6', 'M10 11v6', 'M14 11v6'],
      play:     ['M7 4l13 8-13 8z'],
      pause:    ['M7 4h3v16H7z', 'M14 4h3v16h-3z'],
      rotateCw: ['M21 12a9 9 0 1 1-2.6-6.4L21 8', 'M21 3v5h-5'],
      rotateCcw:['M3 12a9 9 0 1 0 2.6-6.4L3 8', 'M3 3v5h5'],
      alert:    ['M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', 'M12 9v4', 'M12 17h.01'],
      layers:   ['M12 2L2 7l10 5 10-5-10-5z', 'M2 17l10 5 10-5', 'M2 12l10 5 10-5'],
      zoomIn:   ['M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z', 'M21 21l-4.3-4.3', 'M11 8v6', 'M8 11h6'],
      zoomOut:  ['M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z', 'M21 21l-4.3-4.3', 'M8 11h6'],
      maximize: ['M8 3H5a2 2 0 0 0-2 2v3', 'M21 8V5a2 2 0 0 0-2-2h-3', 'M3 16v3a2 2 0 0 0 2 2h3', 'M16 21h3a2 2 0 0 0 2-2v-3'],
      help:     ['M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z', 'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3', 'M12 17h.01'],
      close:    ['M18 6L6 18', 'M6 6l12 12'],
      down:     ['M6 9l6 6 6-6'],
      up:       ['M18 15l-6-6-6 6'],
      book:     ['M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z', 'M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z'],
      gauge:    ['M12 14l4-4', 'M3.3 19a10 10 0 1 1 17.4 0'],
      move:     ['M5 9l-3 3 3 3', 'M9 5l3-3 3 3', 'M15 19l-3 3-3-3', 'M19 9l3 3-3 3', 'M2 12h20', 'M12 2v20'],
      hand:     ['M18 11V6a2 2 0 0 0-4 0v5', 'M14 10V4a2 2 0 0 0-4 0v6', 'M10 10.5V6a2 2 0 0 0-4 0v8',
                 'M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15'],
    };

    function Icon({ name, className = 'w-4 h-4' }) {
      return html`
        <svg className=${className} viewBox="0 0 24 24" fill="none" stroke="currentColor"
             strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          ${ICONS[name].map((d, i) => html`<path key=${i} d=${d} />`)}
        </svg>`;
    }

    /* ============================================================
     * 8. 單一齒輪的畫法
     * ============================================================ */
    function GearView({ gear, node, selected, spinRpm, clockwise, opts, onPointerDown, registerRotor,
                        crankMode, shaking, registerCounter }) {
      const r = radiusOf(gear.teeth);
      const hasError = node.jammed || node.clashed;
      const isBack = gear.layer === 1;

      // 依狀態決定顏色：紅 = 錯誤、金 = 馬達、藍 = 被帶動、灰 = 未連接
      const fill = hasError ? 'url(#grad-error)'
        : gear.isMotor ? 'url(#grad-motor)'
        : node.driven ? 'url(#grad-driven)'
        : 'url(#grad-idle)';
      const stroke = hasError ? '#7f1d1d'
        : gear.isMotor ? '#78350f'
        : node.driven ? '#0c4a6e'
        : '#1e293b';
      const arrowColor = gear.isMotor ? '#fbbf24' : '#38bdf8';

      const holes = gear.teeth >= 30 ? 6 : gear.teeth >= 16 ? 5 : 0;   // 輪輻上的減重孔
      const arrow = arrowPath(gear.teeth);
      const deg = (gear.angle * 180) / Math.PI;

      return html`
        <g transform=${`translate(${gear.x} ${gear.y})`}
           opacity=${isBack ? 0.55 : 1}
           className=${crankMode ? 'cursor-pointer' : 'cursor-grab active:cursor-grabbing'}
           onPointerDown=${onPointerDown}>
         <g className=${shaking ? 'gear-shake' : undefined}>

          <!-- 陰影 -->
          <circle cx="3" cy="5" r=${r + ADDENDUM} fill="#000" opacity="0.35" />

          <!-- 選取外框 / 錯誤外框 -->
          ${selected && html`
            <circle r=${r + ADDENDUM + 7} fill="none" stroke="#22d3ee" strokeWidth="2"
                    strokeDasharray="6 5" pointerEvents="none" />`}
          ${hasError && html`
            <circle r=${r + ADDENDUM + 4} fill="none" stroke="#ef4444" strokeWidth="3"
                    className="animate-pulse" pointerEvents="none" />`}

          <!-- 會轉動的部分（角度由動畫迴圈直接更新） -->
          <g ref=${el => registerRotor(gear.id, el)} transform=${`rotate(${deg})`}>
            <path d=${gearPath(gear.teeth)} fill=${fill} stroke=${stroke} strokeWidth="2"
                  strokeLinejoin="round" strokeDasharray=${isBack ? '4 3' : undefined} />
            ${Array.from({ length: holes }, (_, i) => {
              const a = (i / holes) * Math.PI * 2;
              return html`
                <circle key=${i} cx=${r * 0.58 * Math.cos(a)} cy=${r * 0.58 * Math.sin(a)} r=${r * 0.15}
                        fill="#0b1220" opacity="0.55" stroke=${stroke} strokeWidth="1" />`;
            })}
            <circle r=${Math.max(r * 0.3, 9)} fill="rgba(0,0,0,0.18)" stroke=${stroke} strokeWidth="1.5" />
            <circle r="6" fill="#0f172a" stroke=${stroke} strokeWidth="2" />
            <rect x="-1.5" y="-9" width="3" height="4" fill=${stroke} />
            ${gear.isMotor
              ? html`<path d=${`M -5 ${-r + 12} L 5 ${-r + 12} L 0 ${-r + 2} Z`} fill="#fef08a" opacity="0.9" />`
              : html`<line x1="0" y1="-7" x2="0" y2=${-(r * 0.42)} stroke=${stroke} strokeWidth="2" opacity="0.6" />`}

            <!-- 手轉模式：白色把手，方便看出轉了幾圈 -->
            ${crankMode && html`
              <circle cx="0" cy=${-r * 0.72} r=${Math.max(3.5, r * 0.09)} fill="#f8fafc" stroke=${stroke} strokeWidth="1.5" />`}
          </g>

          <!-- 馬達標記 -->
          ${gear.isMotor && html`
            <text y="-12" textAnchor="middle" fontSize="9" fontWeight="700" fill="#fde68a"
                  pointerEvents="none" style=${{ userSelect: 'none' }}>M</text>`}

          <!-- 轉向箭頭 -->
          ${opts.showArrows && spinRpm > 0 && html`
            <g transform=${clockwise ? undefined : 'scale(-1 1)'} pointerEvents="none" opacity="0.9">
              <path d=${arrow.arc} fill="none" stroke=${arrowColor} strokeWidth="2.5" strokeLinecap="round" />
              <path d=${arrow.head} fill=${arrowColor} />
            </g>`}

          <!-- 齒數與轉速標籤（手轉模式改顯示圈數，文字由動畫迴圈即時填入） -->
          ${opts.showLabels && (crankMode
            ? html`
              <text ref=${el => registerCounter(gear.id, el)} y=${r + ADDENDUM + 17} textAnchor="middle" fontSize="11"
                    fill=${hasError ? '#fca5a5' : '#6ee7b7'} pointerEvents="none" style=${{ userSelect: 'none' }}></text>`
            : html`
              <text y=${r + ADDENDUM + 17} textAnchor="middle" fontSize="11"
                    fill=${hasError ? '#fca5a5' : '#94a3b8'} pointerEvents="none" style=${{ userSelect: 'none' }}>
                ${gear.teeth}齒${isBack ? '・後' : ''} · ${fmt(spinRpm, 1)} rpm
              </text>`)}
         </g>
        </g>`;
    }

    /* ============================================================
     * 9. 側邊面板：馬達控制
     * ============================================================ */
    function MotorPanel({ running, setRunning, dir, setDir, rpm, setRpm, motorFrozen }) {
      return html`
        <section className="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-lg p-3 space-y-3">

                      : 'bg-emerald-600/20 border-emerald-500/50 text-emerald-200'}`}>
              <${Icon} name=${running ? 'pause' : 'play'} /> ${running ? '暫停' : '啟動'}
            </button>
            <button onClick=${() => setDir(d => (d === 1 ? -1 : 1))}

              <span>轉速</span>
              <span className="text-slate-200 font-mono">${rpm} rpm</span>
            </div>

                   onChange=${e => setRpm(Number(e.target.value))} className="w-full accent-amber-400" />
          </label>

          ${motorFrozen && html`
            <p className="text-xs text-red-300">馬達所在的傳動系統已停止，請先排除紅色齒輪。</p>`}
        </section>`;
    }

    /* ============================================================
     * 10. 側邊面板：選取齒輪的資訊與傳動計算
     * ============================================================ */
    function GearInfoPanel({ gear, node, chain, rpm, dir, effectiveRpm, onClose, onTeeth, onToggleLayer, onRemove }) {
      const statusText = node.clashed ? html`<span className="text-red-300">干涉</span>`
        : node.jammed ? html`<span className="text-red-300">卡死</span>`
        : node.driven ? html`<span className="text-emerald-300">${gear.isMotor ? '動力來源' : '由馬達帶動'}</span>`
        : html`<span className="text-slate-400">未連接</span>`;

      // 轉速計算式，例如：12 rpm × (12/36) × (同軸 1) × (12/36)
      const formula = chain.slice(1).map((c, i) => {
        const prev = chain[i].gear;
        const term = c.kind === 'axle' ? '(同軸 1)' : `(${prev.teeth}/${c.gear.teeth})`;
        return i < chain.length - 2 ? `${term} × ` : `${term} `;
      }).join('');

      return html`
        <section className="bg-slate-900/90 backdrop-blur border border-cyan-800/70 rounded-lg p-3 space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="text-xs font-bold tracking-widest text-cyan-300">
              ${gear.isMotor ? '選取：馬達' : '選取：齒輪'}
            </h2>
            <button onClick=${onClose} className="text-slate-500 hover:text-slate-200"><${Icon} name="close" /></button>
          </div>

          <!-- 齒數滑桿 -->
          <label className="block text-xs text-slate-400">
            <div className="flex justify-between mb-1">
              <span>齒數</span>
              <span className="text-slate-200 font-mono">${gear.teeth} 齒</span>
            </div>
            <input type="range" min=${MIN_TEETH} max=${MAX_TEETH} step="1" value=${gear.teeth}
                   onChange=${e => onTeeth(Number(e.target.value))} className="w-full accent-cyan-400" />
          </label>

          <!-- 數據 -->
          <dl className="grid grid-cols-2 gap-x-2 gap-y-1.5 text-xs">
            <dt className="text-slate-400">節圓直徑</dt>
            <dd className="text-right font-mono">${fmt(radiusOf(gear.teeth) * 2, 0)} px</dd>

            <dt className="text-slate-400">狀態</dt>
            <dd className="text-right">${statusText}</dd>

            ${node.driven && !gear.isMotor && html`
              <dt className="text-slate-400">傳動比</dt>
              <dd className="text-right font-mono">× ${fmt(Math.abs(node.ratio), 3)}</dd>

              <dt className="text-slate-400">轉向</dt>
              <dd className="text-right">${node.ratio * dir > 0 ? '順時針 ↻' : '逆時針 ↺'}</dd>

              <dt className="text-slate-400">轉矩倍率</dt>
              <dd className="text-right font-mono">× ${fmt(1 / Math.abs(node.ratio), 2)}</dd>`}

            <dt className="text-slate-400">轉速</dt>
            <dd className="text-right font-mono">${fmt(effectiveRpm, 2)} rpm</dd>
          </dl>

          <!-- 從馬達到這個齒輪的傳動路徑 -->
          ${chain.length > 1 && html`
            <div className="text-xs bg-slate-950/60 rounded p-2 space-y-1.5">
              <div className="text-slate-400">傳動路徑</div>
              <div className="flex flex-wrap items-center gap-1 font-mono">
                ${chain.map((c, i) => html`
                  <${React.Fragment} key=${c.gear.id}>
                    ${i > 0 && html`
                      <span className=${c.kind === 'axle' ? 'text-cyan-400' : 'text-slate-500'}>
                        ${c.kind === 'axle' ? '＝' : '→'}
                      </span>`}
                    <span className=${`px-1.5 rounded ${c.gear.isMotor
                      ? 'bg-amber-500/20 text-amber-200'
                      : 'bg-sky-500/15 text-sky-200'}`}>${c.gear.teeth}</span>
                  <//>`)}
              </div>
              <div className="text-slate-400 leading-relaxed">
                ${rpm} rpm × ${formula}= <span className="text-slate-100">${fmt(rpm * Math.abs(node.ratio), 2)} rpm</span>
              </div>
            </div>`}

          <!-- 操作按鈕 -->
          <div className="flex gap-2">
            <button onClick=${onToggleLayer}
                    className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded text-xs border bg-slate-800 border-slate-600 hover:bg-slate-700">
              <${Icon} name="layers" className="w-3.5 h-3.5" /> ${gear.layer === 0 ? '移到後層' : '移到前層'}
            </button>
            ${!gear.isMotor && html`
              <button onClick=${onRemove}
                      className="flex-1 flex items-center justify-center gap-1 py-1.5 rounded text-xs border bg-red-950 border-red-800 text-red-200 hover:bg-red-900">
                <${Icon} name="trash" className="w-3.5 h-3.5" /> 刪除
              </button>`}
          </div>
        </section>`;
    }

    /* ============================================================
     * 11. 側邊面板：顯示選項
     * ============================================================ */
    const OPTION_LABELS = [
      ['showLabels', '齒數與轉速標籤'],
      ['showArrows', '轉向箭頭'],
      ['showLinks',  '嚙合連接線與接觸點'],
      ['gridSnap',   '格線吸附'],
    ];

    function OptionsPanel({ opts, setOpts }) {
      return html`
        <section className="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-lg p-3 space-y-2">
          <h2 className="text-xs font-bold tracking-widest text-slate-300">顯示與吸附</h2>
          ${OPTION_LABELS.map(([key, label]) => html`
            <label key=${key} className="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" checked=${opts[key]} className="accent-cyan-400"
                     onChange=${e => setOpts(o => ({ ...o, [key]: e.target.checked }))} />
              ${label}
            </label>`)}
        </section>`;
    }

    /* ============================================================
     * 11-2. 側邊面板：手轉觀察（即時列出每顆齒輪轉了幾圈）
     * ============================================================ */
    function CrankPanel({ rows, hasDriver, jammed, onReset, registerCell }) {
      const tagClass = (r) => r.isDriver ? 'bg-emerald-500/20 text-emerald-200'
        : r.isMotor ? 'bg-amber-500/20 text-amber-200'
        : 'bg-sky-500/15 text-sky-200';

      return html`
        <section className="bg-slate-900/90 backdrop-blur border border-emerald-800/70 rounded-lg p-3 space-y-2">
          <div className="flex items-center justify-between">
            <h2 className="text-xs font-bold tracking-widest text-emerald-300 flex items-center gap-1.5">
              <${Icon} name="hand" /> 手轉觀察
            </h2>
            <button onClick=${onReset}
                    className="text-xs px-2 py-0.5 rounded border border-slate-600 bg-slate-800 hover:bg-slate-700">
              計數歸零
            </button>
          </div>

          ${!hasDriver ? html`
            <p className="text-xs text-slate-400 leading-relaxed">
              按住任一顆齒輪，<span className="text-slate-200 font-semibold">繞著它的中心拖動</span>，就能用手轉它。
              換不同的齒輪轉轉看，比較每顆齒輪各轉了幾圈。
            </p>`

          : jammed ? html`
            <p className="text-xs text-red-300">這組齒輪卡死或互相重疊，轉不動。</p>`

          : html`
            <table className="w-full text-xs">
              <thead>
                <tr className="text-slate-400 text-left">
                  <th className="font-normal py-1">齒輪</th>
                  <th className="font-normal text-right">圈數</th>
                  <th className="font-normal text-right">方向</th>
                  <th className="font-normal text-right">齒數×圈數</th>
                </tr>
              </thead>
              <tbody className="font-mono">
                ${rows.map(r => html`
                  <tr key=${r.id} className="border-t border-slate-800">
                    <td className="py-1 whitespace-nowrap">
                      <span className=${`px-1.5 rounded ${tagClass(r)}`}>${r.teeth}${r.isBack ? '後' : ''}</span>
                      ${r.isDriver && html`<span className="ml-1 text-emerald-300 font-sans">主動</span>`}
                    </td>
                    <td className="text-right" ref=${el => registerCell('t-' + r.id, el)}></td>
                    <td className="text-right font-sans text-slate-300">${r.isDriver ? '—' : r.same ? '同向' : '反向'}</td>
                    <td className="text-right" ref=${el => registerCell('p-' + r.id, el)}></td>
                  </tr>`)}
              </tbody>
            </table>
            <p className="text-[11px] text-slate-400 leading-relaxed">
              規律：咬合的兩顆齒輪轉過的「齒數」一樣多，所以 齒數 × 圈數 相同、轉向相反；同軸的齒輪圈數相同、轉向相同。
            </p>`}
        </section>`;
    }

    /* ============================================================
     * 12. 說明視窗
     * ============================================================ */
    function HelpDialog({ onClose }) {
      const Key = ({ children }) => html`<kbd className="px-1.5 bg-slate-800 rounded">${children}</kbd>`;
      return html`
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick=${onClose}>

            </div>

              <li>拖曳空白處可平移畫面；用滾輪、雙指捏合或上方按鈕縮放。</li>
              <li>點選齒輪可在右側面板調整齒數、圖層，並查看轉速計算過程。</li>
              <li>雙擊（或連點兩下）齒輪即可刪除；馬達無法刪除。</li>
              <li>把齒輪移到「後層」並拖到前層齒輪的中心，就成為同軸複合齒輪。</li>
              <li>切到「手轉」模式後，按住任一顆齒輪繞著中心拖動，就能用手轉它；右側面板會即時列出每顆齒輪轉了幾圈。</li>
            </ul>

            <div>
              <h3 className="font-semibold text-slate-100 mb-1">快捷鍵</h3>
              <div className="grid grid-cols-2 gap-1 text-slate-300">
                <span><${Key}>空白鍵<//> 啟動／暫停</span>
                <span><${Key}>R<//> 反轉馬達</span>
                <span><${Key}>L<//> 切換圖層</span>
                <span><${Key}>Delete<//> 刪除</span>
                <span><${Key}>Esc<//> 取消選取</span>
                <span><${Key}>C<//> 切換移動／手轉</span>
              </div>
            </div>

            <div>
              <h3 className="font-semibold text-slate-100 mb-1">小知識</h3>
              <ul className="space-y-1.5 text-slate-300 list-disc pl-5">
                <li>兩齒輪嚙合時轉向相反，轉速比 = 主動輪齒數 ÷ 從動輪齒數。</li>
                <li>小齒輪帶大齒輪會減速，但轉矩放大（理想情況下功率不變）。</li>
                <li>惰輪夾在中間只改變轉向，不影響最終的傳動比。</li>
                <li>同軸的齒輪轉速相同，所以複合齒輪的總傳動比是各級相乘。</li>
                <li>奇數個齒輪圍成一圈會互相卡死；偶數個則可以轉動。</li>
              </ul>
            </div>
          </div>
        </div>`;
    }

                從好奇出發，讓探索沒有邊界。 跟著域見未來，一起發現更多學習的可能。
              </p>
            </div>

            <!-- IG 連結 -->
            <a href="https://www.instagram.com/yujian_meetagain/" target="_blank" rel="noopener noreferrer"
               className="flex-shrink-0 flex items-center gap-2 text-slate-400 hover:text-pink-500 transition-colors duration-300 group">
              <span className="text-xs font-mono group-hover:text-pink-400 transition-colors">Follow Us</span>
              <svg className="w-5 h-5 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path fillRule="evenodd" clipRule="evenodd" d=${IG_ICON_PATH} />
              </svg>
            </a>
          </div>
        </footer>`;
    }

    /* ============================================================
     * 14. 主程式
     * ============================================================ */
    function App() {
      /* ---------- 資料 ----------
       * 齒輪的位置與角度放在 ref 裡，動畫時直接改 DOM，不觸發 React 重繪，
       * 只有在結構改變（新增、移動、刪除…）時才呼叫 commit() 重新繪製。
       */
      const [initial] = useState(loadState);
      const svgRef = useRef(null);
      const gearsRef = useRef(initial.gears);                     // 所有齒輪
      const topoRef = useRef(computeTopology(initial.gears));     // 傳動分析結果
      const rotorRefs = useRef(new Map());                        // 每個齒輪「會轉動的 <g>」
      const interaction = useRef({ mode: 'idle' });               // 目前的操作：idle / drag / pan / pinch
      const pointers = useRef(new Map());                         // 目前按在畫布上的手指 / 滑鼠
      const lastTap = useRef({ id: '', t: 0 });                   // 用來判斷雙擊

      const [version, setVersion] = useState(0);                  // 每次 commit 加一，觸發重繪
      const [selectedId, setSelectedId] = useState(null);
      const [running, setRunning] = useState(true);
      const [rpm, setRpm] = useState(initial.rpm);
      const [dir, setDir] = useState(initial.dir);                // 1 = 順時針、-1 = 逆時針
      const [opts, setOpts] = useState(initial.opts);
      const [view, setView] = useState(() => fitView(initial.gears));   // 畫面範圍 { x, y, w }
      const [panelOpen, setPanelOpen] = useState(true);
      const [helpOpen, setHelpOpen] = useState(false);
      const [presetOpen, setPresetOpen] = useState(false);
      const [presetPos, setPresetPos] = useState({ left: 16, top: 64 });

      // 手轉模式
      const [mode, setMode] = useState('move');                   // 'move' 移動 / 'crank' 手轉
      const [observeId, setObserveId] = useState(null);           // 最近一次手轉的齒輪（觀察表的主動輪）
      const [shakeId, setShakeId] = useState(null);               // 轉不動時抖動的齒輪
      const [toast, setToast] = useState(null);                   // 短暫提示訊息
      const modeRef = useRef(mode);
      const crankRef = useRef(null);                              // 手轉中：{ id, topo, last }
      const baseAngles = useRef(new Map());                       // 圈數計算的起點角度
      const counterRefs = useRef(new Map());                      // 齒輪下方的圈數標籤
      const cellRefs = useRef(new Map());                         // 觀察表中的圈數 / 齒數×圈數欄位
      const toastTimer = useRef(0);
      useEffect(() => { modeRef.current = mode; }, [mode]);

      // 動畫迴圈需要最新的馬達設定，用 ref 同步一份
      const motion = useRef({ running, rpm, dir });
      useEffect(() => { motion.current = { running, rpm, dir }; }, [running, rpm, dir]);

      /**
       * 換一個起點重新推算角度時，齒輪可能被「整圈」或「整齒」地平移：畫面看起來完全一樣，
       * 但圈數計數會跳。這裡把這個平移量同步加到起點角度上，讓圈數不受影響。
       */
      const applyKeepingCounters = useCallback((topo) => {
        const before = new Map(gearsRef.current.map(g => [g.id, g.angle]));
        applyKinematics(topo);
        for (const g of gearsRef.current) {
          const shift = g.angle - before.get(g.id);
          if (shift !== 0 && baseAngles.current.has(g.id)) {
            baseAngles.current.set(g.id, baseAngles.current.get(g.id) + shift);
          }
        }
      }, []);

      // 結構改變後：重新分析傳動關係並重繪
      const commit = useCallback(() => {
        const topo = computeTopology(gearsRef.current);
        applyKeepingCounters(topo);
        topoRef.current = topo;
        setVersion(v => v + 1);
      }, []);

      const registerRotor = useCallback((id, el) => {
        if (el) rotorRefs.current.set(id, el);
        else rotorRefs.current.delete(id);
      }, []);
      const registerCounter = useCallback((id, el) => {
        if (el) counterRefs.current.set(id, el);
        else counterRefs.current.delete(id);
      }, []);
      const registerCell = useCallback((key, el) => {
        if (el) cellRefs.current.set(key, el);
        else cellRefs.current.delete(key);
      }, []);

      // 圈數歸零：以每顆齒輪目前的角度作為新的起點
      const resetCounters = useCallback(() => {
        baseAngles.current.clear();
        gearsRef.current.forEach(g => baseAngles.current.set(g.id, g.angle));
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 1800);
      };

      // 切換「移動 / 手轉」模式；進入手轉時先暫停馬達，方便觀察
      const switchMode = (next) => {
        if (next === mode) return;
        crankRef.current = null;
        interaction.current = { mode: 'idle' };
        setMode(next);
        if (next === 'crank') {
          setRunning(false);
          resetCounters();
          setObserveId(null);
        }
      };

      /* ---------- 動畫迴圈：每一幀轉動馬達，並推算其他齒輪的角度 ---------- */
      useEffect(() => {
        let raf = 0;
        let last = performance.now();

        const frame = (t) => {
          const dt = Math.min((t - last) / 1000, 0.05);   // 秒；切回分頁時避免一次跳太多
          last = t;
          const crank = crankRef.current;

          if (crank) {
            // 手轉中：被轉的齒輪角度由手指決定，其他齒輪從它往外推算
            applyKinematics(crank.topo);
          } else {
            // 一般情況：由馬達帶動
            const topo = topoRef.current;
            const { running: on, rpm: speed, dir: d } = motion.current;
            const motor = gearsRef.current.find(g => g.isMotor);
            if (motor && on) {
              const motorNode = topo.nodes.get(motor.id);
              if (motorNode && !motorNode.frozen) motor.angle += d * speed * (Math.PI * 2 / 60) * dt;
            }
            applyKinematics(topo);
          }

          for (const g of gearsRef.current) {
            const el = rotorRefs.current.get(g.id);
            if (el) el.setAttribute('transform', `rotate(${((g.angle * 180) / Math.PI).toFixed(3)})`);
          }

          // 手轉模式：更新每顆齒輪的圈數（順時針 ↻、逆時針 ↺）
          if (modeRef.current === 'crank') {
            for (const g of gearsRef.current) {
              if (!baseAngles.current.has(g.id)) baseAngles.current.set(g.id, g.angle);
              const turns = (g.angle - baseAngles.current.get(g.id)) / (Math.PI * 2);
              const abs = Math.abs(turns);
              const arrow = turns > 0.005 ? ' ↻' : turns < -0.005 ? ' ↺' : '';

              const label = counterRefs.current.get(g.id);
              if (label) label.textContent = `${g.teeth}齒${g.layer === 1 ? '・後' : ''} · ${abs.toFixed(2)} 圈${arrow}`;
              const turnCell = cellRefs.current.get('t-' + g.id);
              if (turnCell) turnCell.textContent = abs.toFixed(2) + arrow;
              const productCell = cellRefs.current.get('p-' + g.id);
              if (productCell) productCell.textContent = (abs * g.teeth).toFixed(1);
            }
          }
          raf = requestAnimationFrame(frame);
        };

        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, []);

      /* ---------- 自動儲存（停止操作 0.4 秒後才存） ---------- */
      useEffect(() => {
        const timer = setTimeout(() => {
          try {
            const gears = gearsRef.current.map(({ id, teeth, x, y, layer, isMotor }) => ({ id, teeth, x, y, layer, isMotor }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ gears, rpm, dir, opts }));
          } catch { /* 無法儲存時忽略 */ }
        }, 400);
        return () => clearTimeout(timer);
      }, [version, rpm, dir, opts]);

      /* ---------- 座標轉換：螢幕座標 → 畫布 (SVG) 座標 ---------- */
      const toSvg = useCallback((clientX, clientY) => {
        const svg = svgRef.current;
        const ctm = svg && svg.getScreenCTM();
        if (!ctm) return { x: 0, y: 0 };
        const p = svg.createSVGPoint();
        p.x = clientX;
        p.y = clientY;
        const r = p.matrixTransform(ctm.inverse());
        return { x: r.x, y: r.y };
      }, []);

      /* ---------- 縮放 ---------- */

      // 滑鼠滾輪：以游標位置為中心縮放
      useEffect(() => {
        const svg = svgRef.current;
        if (!svg) return;
        const onWheel = (e) => {
          e.preventDefault();
          const p = toSvg(e.clientX, e.clientY);
          const f = Math.exp(e.deltaY * 0.0015);
          setView(v => {
            const w = clamp(v.w * f, 300, 3000);
            const k = w / v.w;
            return { x: p.x - (p.x - v.x) * k, y: p.y - (p.y - v.y) * k, w };
          });
        };
        svg.addEventListener('wheel', onWheel, { passive: false });
        return () => svg.removeEventListener('wheel', onWheel);
      }, [toSvg]);

      // 工具列按鈕：以畫面中心縮放
      const zoomBy = (f) => {
        setView(v => {
          const w = clamp(v.w * f, 300, 3000);
          const cx = v.x + v.w / 2, cy = v.y + (v.w * ASPECT) / 2;
          return { x: cx - w / 2, y: cy - (w * ASPECT) / 2, w };
        });
      };

      // 阻止 iOS Safari 原生的整頁雙指縮放手勢
      useEffect(() => {
        const stop = (e) => e.preventDefault();
        document.addEventListener('gesturestart', stop);
        document.addEventListener('gesturechange', stop);
        return () => {
          document.removeEventListener('gesturestart', stop);
          document.removeEventListener('gesturechange', stop);
        };
      }, []);

      /* ---------- 齒輪操作 ---------- */

      // 把齒輪 g 放到 (x, y) 是否會和同一層的其他齒輪重疊
      const wouldClash = (g, x, y) =>
        gearsRef.current.some(o =>
          o !== g && o.layer === g.layer &&
          Math.hypot(o.x - x, o.y - y) < radiusOf(o.teeth) + radiusOf(g.teeth) - MESH_TOL);

      // 放開齒輪時自動吸附：同層 → 貼齊嚙合距離；不同層 → 貼齊中心成為同軸
      const snapGear = (g) => {
        const candidates = [];
        for (const o of gearsRef.current) {
          if (o === g) continue;
          const d = Math.hypot(g.x - o.x, g.y - o.y);
          if (o.layer === g.layer) {
            const ideal = radiusOf(g.teeth) + radiusOf(o.teeth);
            const diff = Math.abs(d - ideal);
            if (diff < SNAP_DIST) {
              const a = d > 0.001 ? Math.atan2(g.y - o.y, g.x - o.x) : 0;
              candidates.push({ x: o.x + ideal * Math.cos(a), y: o.y + ideal * Math.sin(a), diff });
            }
          } else if (d < SNAP_DIST) {
            candidates.push({ x: o.x, y: o.y, diff: d });
          }
        }
        // 優先選最近、且不會撞到其他齒輪的位置
        candidates.sort((a, b) => a.diff - b.diff);
        const pick = candidates.find(c => !wouldClash(g, c.x, c.y)) || candidates[0];
        if (pick) {
          g.x = pick.x;
          g.y = pick.y;
        } else if (opts.gridSnap) {
          g.x = Math.round(g.x / GRID) * GRID;
          g.y = Math.round(g.y / GRID) * GRID;
        }
      };

      // 新增齒輪：在畫面中央附近找一個空位
      const addGear = (teeth) => {
        const g = makeGear(teeth, 0, 0);
        const cx = view.x + view.w / 2, cy = view.y + (view.w * ASPECT) / 2;
        let placed = false;
        for (let i = 0; i < 60 && !placed; i++) {
          const spread = 40 + i * 6;
          const x = cx + (Math.random() * 2 - 1) * spread;
          const y = cy + (Math.random() * 2 - 1) * spread * ASPECT;
          const isFree = gearsRef.current.every(o =>
            o.layer !== g.layer || Math.hypot(o.x - x, o.y - y) > radiusOf(o.teeth) + radiusOf(teeth) + 12);
          if (isFree) { g.x = x; g.y = y; placed = true; }
        }
        if (!placed) { g.x = cx; g.y = cy; }
        gearsRef.current = [...gearsRef.current, g];
        setSelectedId(g.id);
        commit();
      };

      const removeGear = (id) => {
        const g = gearsRef.current.find(x => x.id === id);
        if (!g || g.isMotor) return;   // 馬達不能刪
        gearsRef.current = gearsRef.current.filter(x => x.id !== id);
        if (selectedId === id) setSelectedId(null);
        commit();
      };

      const toggleLayer = (id) => {
        const g = gearsRef.current.find(x => x.id === id);
        if (!g) return;
        g.layer = g.layer === 0 ? 1 : 0;
        commit();
      };

      // 改變齒數時，沿原本的方向重新貼合到帶動它的齒輪
      const setTeeth = (id, teeth) => {
        const g = gearsRef.current.find(x => x.id === id);
        if (!g || g.teeth === teeth) return;
        const topo = topoRef.current;
        const node = topo.nodes.get(id);

        let partnerId = node && node.kind === 'mesh' ? node.parent : null;
        if (!partnerId) {
          const link = topo.links.find(l => l.kind === 'mesh' && (l.a === id || l.b === id));
          if (link) partnerId = link.a === id ? link.b : link.a;
        }
        const partner = partnerId ? topo.byId.get(partnerId) : null;

        g.teeth = teeth;
        if (partner) {
          const a = Math.atan2(g.y - partner.y, g.x - partner.x);
          const d = radiusOf(partner.teeth) + radiusOf(teeth);
          g.x = partner.x + d * Math.cos(a);
          g.y = partner.y + d * Math.sin(a);
        }
        commit();
      };

      const loadPreset = (preset) => {
        gearsRef.current = preset.build();
        setSelectedId(null);
        setPresetOpen(false);
        setView(fitView(gearsRef.current));
        commit();
      };

      const clearAll = () => {
        const motor = gearsRef.current.find(g => g.isMotor);
        gearsRef.current = motor ? [motor] : [makeGear(14, 300, 300, 0, true)];
        setSelectedId(null);
        commit();
      };

      /* ---------- 雙指縮放 / 平移 ----------
       * viewBox 使用 slice 且寬高比固定，所以：螢幕座標 = C + (畫布座標 - view.x) × s，
       * 其中 s（每單位幾像素）與 view.w 成反比。據此讓手指中點下方的點始終跟著手指走。
       */
      const startPinch = () => {
        const ctm = svgRef.current && svgRef.current.getScreenCTM();
        const pts = [...pointers.current.values()];
        if (!ctm || pts.length < 2) return;

        // 若正在拖曳齒輪，先讓它就地吸附並結束拖曳；若正在手轉，停止手轉
        crankRef.current = null;
        const it = interaction.current;
        if (it.mode === 'drag') {
          const g = gearsRef.current.find(x => x.id === it.id);
          if (g) snapGear(g);
          commit();
        }

        const [a, b] = pts;
        const mid = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
        interaction.current = {
          mode: 'pinch',
          d0: Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1),   // 起始兩指距離
          w0: view.w,                                          // 起始畫面寬度
          s0: ctm.a,                                           // 起始縮放比例（每單位幾像素）
          cx: ctm.e + view.x * ctm.a,                          // 上式中的常數 C（x 方向）
          cy: ctm.f + view.y * ctm.a,                          // 上式中的常數 C（y 方向）
          px: mid.x,                                           // 手指中點對應的畫布座標
          py: mid.y,
        };
      };

      // 記錄按下的指標；若已經有兩根手指，改為縮放模式
      const trackPointer = (e) => {
        pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { svgRef.current.setPointerCapture(e.pointerId); } catch { /* ignore */ }
        if (pointers.current.size >= 2) {
          startPinch();
          return true;
        }
        return false;
      };

      /* ---------- 指標事件（滑鼠與觸控共用） ---------- */

      // 按下齒輪：移動模式 → 開始拖曳（連按兩下則刪除）；手轉模式 → 開始手轉
      const onGearPointerDown = (e, id) => {
        e.stopPropagation();
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (trackPointer(e)) return;

        if (mode === 'crank') {
          startCrank(e, id);
          return;
        }

        const now = performance.now();
        if (lastTap.current.id === id && now - lastTap.current.t < 320) {
          lastTap.current = { id: '', t: 0 };
          removeGear(id);
          return;
        }
        lastTap.current = { id, t: now };

        const g = gearsRef.current.find(x => x.id === id);
        if (!g) return;
        const p = toSvg(e.clientX, e.clientY);
        interaction.current = { mode: 'drag', id, dx: g.x - p.x, dy: g.y - p.y };
        gearsRef.current = gearsRef.current.filter(x => x.id !== id).concat(g);   // 移到最上層
        setSelectedId(id);
        commit();
      };

      /* ---------- 手轉 ----------
       * 以被按住的齒輪為起點重新分析傳動關係，之後手指繞著齒輪中心轉多少角度，
       * 齒輪就轉多少，相連的齒輪（包含馬達）依齒數比跟著轉。
       */
      const startCrank = (e, id) => {
        setSelectedId(id);
        const g = gearsRef.current.find(x => x.id === id);
        if (!g) return;

        // 換了一顆主動輪 → 圈數重新計算
        if (observeId !== id) {
          resetCounters();
          setObserveId(id);
        }

        const topo = computeTopology(gearsRef.current, id);
        const node = topo.nodes.get(id);
        if (node.frozen) {
          setShakeId(id);
          setTimeout(() => setShakeId(null), 450);
          showToast(node.clashed ? '這顆齒輪和別的齒輪重疊了，轉不動！' : '這組齒輪卡死了，轉不動！');
          interaction.current = { mode: 'idle' };
          return;
        }

        applyKeepingCounters(topo);   // 改以這顆齒輪為起點
        const p = toSvg(e.clientX, e.clientY);
        crankRef.current = { id, topo, last: Math.atan2(p.y - g.y, p.x - g.x) };
        interaction.current = { mode: 'crank', id };
      };

      // 按下空白處：準備平移畫面
      const onCanvasPointerDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (trackPointer(e)) return;
        const scale = (svgRef.current.getScreenCTM() || { a: 1 }).a;
        interaction.current = { mode: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, scale, moved: false };
      };

      const onPointerMove = (e) => {
        if (pointers.current.has(e.pointerId)) pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const it = interaction.current;

        if (it.mode === 'pinch') {
          const pts = [...pointers.current.values()];
          if (pts.length < 2) return;
          const [a, b] = pts;
          const d = Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1);
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const w = clamp(it.w0 * (it.d0 / d), 300, 3000);
          const s = it.s0 * (it.w0 / w);
          setView({ x: it.px - (mx - it.cx) / s, y: it.py - (my - it.cy) / s, w });
        } else if (it.mode === 'crank') {
          const crank = crankRef.current;
          if (!crank) return;
          const g = crank.topo.byId.get(crank.id);
          const p = toSvg(e.clientX, e.clientY);
          if (Math.hypot(p.x - g.x, p.y - g.y) < 6) return;   // 太靠近中心時角度不穩定，略過
          const a = Math.atan2(p.y - g.y, p.x - g.x);
          let delta = a - crank.last;
          if (delta > Math.PI) delta -= Math.PI * 2;           // 跨過 ±180° 時接續角度
          else if (delta < -Math.PI) delta += Math.PI * 2;
          g.angle += delta;
          crank.last = a;
        } else if (it.mode === 'drag') {
          const g = gearsRef.current.find(x => x.id === it.id);
          if (!g) return;
          const p = toSvg(e.clientX, e.clientY);
          g.x = p.x + it.dx;
          g.y = p.y + it.dy;
          commit();
        } else if (it.mode === 'pan') {
          const mx = e.clientX - it.sx, my = e.clientY - it.sy;
          if (Math.abs(mx) + Math.abs(my) > 3) it.moved = true;   // 移動超過 3px 才算平移，否則視為點擊
          if (!it.moved) return;
          setView(v => ({ ...v, x: it.vx - mx / it.scale, y: it.vy - my / it.scale }));
        }
      };

      const onPointerUp = (e) => {
        pointers.current.delete(e.pointerId);
        try { svgRef.current.releasePointerCapture(e.pointerId); } catch { /* ignore */ }
        const it = interaction.current;

        if (it.mode === 'pinch') {
          // 放開一根手指就結束縮放；剩下的手指不接續平移，避免畫面跳動
          if (pointers.current.size < 2) interaction.current = { mode: 'idle' };
          return;
        }
        if (it.mode === 'crank') {
          crankRef.current = null;
          interaction.current = { mode: 'idle' };
          commit();   // 以新的角度重新建立馬達的傳動關係
          return;
        }
        if (it.mode === 'drag') {
          const g = gearsRef.current.find(x => x.id === it.id);
          if (g) snapGear(g);
          commit();
        } else if (it.mode === 'pan' && !it.moved) {
          setSelectedId(null);   // 點一下空白處 = 取消選取
        }
        interaction.current = { mode: 'idle' };
      };

      /* ---------- 鍵盤快捷鍵 ---------- */
      useEffect(() => {
        const onKey = (e) => {
          const tag = e.target && e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); setRunning(r => !r); }
          else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) removeGear(selectedId);
          else if ((e.key === 'l' || e.key === 'L') && selectedId) toggleLayer(selectedId);
          else if (e.key === 'r' || e.key === 'R') setDir(d => (d === 1 ? -1 : 1));
          else if (e.key === 'c' || e.key === 'C') switchMode(mode === 'crank' ? 'move' : 'crank');
          else if (e.key === 'Escape') { setSelectedId(null); setHelpOpen(false); setPresetOpen(false); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      /* ============================================================
       * 準備畫面要用的資料
       * ============================================================ */
      const topo = topoRef.current;
      const gears = gearsRef.current;
      const orderedGears = [...gears].sort((a, b) => b.layer - a.layer);   // 後層先畫，前層蓋在上面
      const drivenCount = gears.filter(g => !g.isMotor && topo.nodes.get(g.id).driven).length;
      const motorFrozen = gears.some(g => g.isMotor && topo.nodes.get(g.id).frozen);

      // 某個齒輪實際的轉速（rpm）
      const effectiveRpm = (n) => (n && n.driven && !n.frozen && running ? rpm * Math.abs(n.ratio) : 0);

      // 左下角狀態
      const status = topo.clash ? { label: '干涉',   cls: 'bg-red-500/20 text-red-300 border-red-500/50' }
        : topo.jam               ? { label: '卡死',   cls: 'bg-red-500/20 text-red-300 border-red-500/50' }
        : !running || rpm === 0  ? { label: '暫停',   cls: 'bg-amber-500/20 text-amber-200 border-amber-500/40' }
        :                          { label: '運轉中', cls: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' };

      const errorMsg = topo.clash ? '干涉：同一層的齒輪重疊了（紅色）。把它們拖開，或將其中一個移到後層。'
        : topo.jam ? '卡死：迴路中的齒輪轉向互相衝突。奇數個齒輪圍成一圈就會卡死。'
        : null;

      // 目前選取的齒輪，以及從馬達到它的傳動路徑
      const selected = selectedId ? topo.byId.get(selectedId) : null;
      const selectedNode = selected ? topo.nodes.get(selected.id) : null;
      const chain = [];
      if (selected && selectedNode.driven) {
        let cur = selected;
        while (cur) {
          const n = topo.nodes.get(cur.id);
          chain.unshift({ gear: cur, kind: n.kind });
          cur = n.parent ? topo.byId.get(n.parent) : null;
        }
      }

      // 手轉觀察表：從主動輪開始，列出所有被它帶動的齒輪
      let crankRows = [];
      let crankJammed = false;
      const hasDriver = mode === 'crank' && !!observeId && topo.byId.has(observeId);
      if (hasDriver) {
        const ot = computeTopology(gears, observeId);
        crankJammed = ot.nodes.get(observeId).frozen;
        crankRows = [observeId, ...ot.order].map(id => {
          const g = ot.byId.get(id);
          return {
            id,
            teeth: g.teeth,
            isBack: g.layer === 1,
            isMotor: g.isMotor,
            isDriver: id === observeId,
            same: ot.nodes.get(id).ratio > 0,   // 與主動輪同向？
          };
        });
      }

      const viewH = view.w * ASPECT;
      const toolBtn ='bg-slate-800 hover:bg-slate-700 transition-colors rounded border border-slate-600';

      /* ============================================================
       * 畫面
       * ============================================================ */
      return html`
        <div className="w-full h-full flex flex-col overflow-hidden text-slate-200 font-sans select-none touch-manipulation bg-slate-950">

          <!-- ========== 上方工具列 ========== -->
          <div className="min-h-16 bg-slate-900 border-b border-slate-700 shadow-xl flex items-center gap-3 px-4 py-2 z-20 relative overflow-x-auto scrollbar-hide">
            <div className="flex items-center gap-2 shrink-0">
              <${Icon} name="cog" className="w-6 h-6 text-cyan-400" />
              <h1 className="text-lg font-bold tracking-widest text-slate-100 whitespace-nowrap">齒輪沙盒</h1>
            </div>

            <!-- 新增齒輪 -->
            <div className="flex items-center gap-1.5 shrink-0">
              ${PALETTE.map(p => html`
                <button key=${p.teeth} onClick=${() => addGear(p.teeth)} title=${`新增 ${p.teeth} 齒齒輪`}
                        className=${`flex items-center px-2.5 py-1.5 text-sm whitespace-nowrap ${toolBtn}`}>
                  <${Icon} name="plus" className=${`w-4 h-4 mr-1 ${p.color}`} />${p.label}
                  <span className="ml-1 text-xs text-slate-400">${p.teeth}</span>
                </button>`)}
            </div>

            <div className="w-px h-8 bg-slate-700 shrink-0"></div>

            <!-- 範例選單按鈕 -->
            <button onClick=${e => {
                      const r = e.currentTarget.getBoundingClientRect();
                      setPresetPos({ left: Math.max(8, Math.min(r.left, window.innerWidth - 296)), top: r.bottom + 6 });
                      setPresetOpen(o => !o);
                    }}
                    className=${`shrink-0 flex items-center px-3 py-1.5 text-sm whitespace-nowrap ${toolBtn}`}>
              <${Icon} name="book" className="w-4 h-4 mr-1 text-amber-300" /> 範例
              <${Icon} name=${presetOpen ? 'up' : 'down'} className="w-4 h-4 ml-1" />
            </button>

            <!-- 模式切換：移動 / 手轉 -->
            <div className="flex items-center shrink-0 rounded border border-slate-600 overflow-hidden">
              <button onClick=${() => switchMode('move')} title="移動模式：拖曳齒輪改變位置（快捷鍵 C）"
                      className=${`flex items-center gap-1 px-3 py-1.5 text-sm whitespace-nowrap transition-colors ${mode === 'move'
                        ? 'bg-cyan-600/30 text-cyan-200' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                <${Icon} name="move" /> 移動
              </button>
              <button onClick=${() => switchMode('crank')} title="手轉模式：按住齒輪繞圈拖動來轉它（快捷鍵 C）"
                      className=${`flex items-center gap-1 px-3 py-1.5 text-sm whitespace-nowrap transition-colors border-l border-slate-600 ${mode === 'crank'
                        ? 'bg-emerald-600/30 text-emerald-200' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                <${Icon} name="hand" /> 手轉
              </button>
            </div>

            <!-- 縮放 -->
            <div className="flex items-center gap-1 shrink-0">
              <button onClick=${() => zoomBy(0.8)}  title="放大"     className=${`p-2 ${toolBtn}`}><${Icon} name="zoomIn" /></button>
              <button onClick=${() => zoomBy(1.25)} title="縮小"     className=${`p-2 ${toolBtn}`}><${Icon} name="zoomOut" /></button>
              <button onClick=${() => setView(fitView(gearsRef.current))} title="顯示全部" className=${`p-2 ${toolBtn}`}><${Icon} name="maximize" /></button>
            </div>

            <div className="flex-1"></div>

            <button onClick=${() => setHelpOpen(true)} title="說明" className=${`p-2 shrink-0 ${toolBtn}`}><${Icon} name="help" /></button>
            <button onClick=${clearAll}
                    className="flex items-center px-3 py-1.5 bg-red-950 hover:bg-red-900 transition-colors rounded border border-red-800 text-sm text-red-200 shrink-0 whitespace-nowrap">
              <${Icon} name="trash" className="w-4 h-4 mr-1" /> 清空
            </button>
          </div>

          <!-- 範例選單（放在工具列外，避免被捲動區裁切） -->
          ${presetOpen && html`
            <div style=${presetPos} className="fixed z-30 w-72 bg-slate-900 border border-slate-600 rounded-lg shadow-2xl p-1">
              ${PRESETS.map(p => html`
                <button key=${p.name} onClick=${() => loadPreset(p)} className="w-full text-left px-3 py-2 rounded hover:bg-slate-800">
                  <div className="text-sm font-semibold text-slate-100">${p.name}</div>
                  <div className="text-xs text-slate-400">${p.desc}</div>
                </button>`)}
            </div>`}

          <!-- ========== 主畫布 ========== -->
          <div className="flex-1 relative w-full overflow-hidden bg-slate-950">

            <!-- 錯誤提示 -->
            ${errorMsg && html`
              <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-red-600/90 border border-red-400 text-white px-5 py-2 rounded-full shadow-[0_0_15px_rgba(220,38,38,0.6)] flex items-center gap-2 z-20 max-w-[90%] pointer-events-none">
                <${Icon} name="alert" className="w-5 h-5 shrink-0" />
                <span className="text-sm font-semibold">${errorMsg}</span>
              </div>`}

            <!-- 手轉模式提示 / 轉不動的提示 -->
            ${toast ? html`
              <div className="absolute top-16 left-1/2 -translate-x-1/2 bg-amber-400/95 text-slate-950 px-4 py-1.5 rounded-full shadow-lg text-sm font-bold z-20 pointer-events-none whitespace-nowrap">
                ${toast}
              </div>`
            : mode === 'crank' && !observeId && !errorMsg && html`
              <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-emerald-900/90 border border-emerald-600/60 text-emerald-100 px-4 py-1.5 rounded-full text-sm z-20 pointer-events-none max-w-[90%] text-center">
                手轉模式：按住任一顆齒輪，繞著中心拖動來轉它
              </div>`}

            <svg id="gearCanvas" ref=${svgRef}
                 className="w-full h-full absolute inset-0 block cursor-move"
                 viewBox=${`${view.x} ${view.y} ${view.w} ${viewH}`}
                 preserveAspectRatio="xMidYMid slice"
                 onPointerDown=${onCanvasPointerDown}
                 onPointerMove=${onPointerMove}
                 onPointerUp=${onPointerUp}
                 onPointerCancel=${onPointerUp}>

              <defs>
                <!-- 背景格線：細格 20、粗格 100 -->
                <pattern id="grid-minor" width=${GRID} height=${GRID} patternUnits="userSpaceOnUse">
                  <path d=${`M ${GRID} 0 L 0 0 0 ${GRID}`} fill="none" stroke="#131c2e" strokeWidth="1" />
                </pattern>
                <pattern id="grid-major" width=${GRID * 5} height=${GRID * 5} patternUnits="userSpaceOnUse">
                  <rect width=${GRID * 5} height=${GRID * 5} fill="url(#grid-minor)" />
                  <path d=${`M ${GRID * 5} 0 L 0 0 0 ${GRID * 5}`} fill="none" stroke="#1e293b" strokeWidth="1.5" />
                </pattern>

                <!-- 齒輪的金屬漸層：未連接 / 被帶動 / 馬達 / 錯誤 -->
                <linearGradient id="grad-idle" x1="20%" y1="0%" x2="80%" y2="100%">
                  <stop offset="0%" stopColor="#94a3b8" /><stop offset="50%" stopColor="#64748b" /><stop offset="100%" stopColor="#334155" />
                </linearGradient>
                <linearGradient id="grad-driven" x1="20%" y1="0%" x2="80%" y2="100%">
                  <stop offset="0%" stopColor="#38bdf8" /><stop offset="50%" stopColor="#0284c7" /><stop offset="100%" stopColor="#0369a1" />
                </linearGradient>
                <linearGradient id="grad-motor" x1="20%" y1="0%" x2="80%" y2="100%">
                  <stop offset="0%" stopColor="#fbbf24" /><stop offset="50%" stopColor="#d97706" /><stop offset="100%" stopColor="#92400e" />
                </linearGradient>
                <linearGradient id="grad-error" x1="20%" y1="0%" x2="80%" y2="100%">
                  <stop offset="0%" stopColor="#fca5a5" /><stop offset="50%" stopColor="#dc2626" /><stop offset="100%" stopColor="#7f1d1d" />
                </linearGradient>
              </defs>

              <rect x=${view.x} y=${view.y} width=${view.w} height=${viewH} fill="url(#grid-major)" pointerEvents="none" />

              <!-- 嚙合連接線（虛線）與同軸標記（圓圈） -->
              ${opts.showLinks && topo.links.map((l, i) => {
                const a = topo.byId.get(l.a), b = topo.byId.get(l.b);
                return l.kind === 'mesh'
                  ? html`<line key=${i} x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y} stroke="#64748b" strokeWidth="2.5"
                               strokeDasharray="5 5" opacity="0.5" pointerEvents="none" />`
                  : html`<circle key=${i} cx=${a.x} cy=${a.y} r="12" fill="none" stroke="#22d3ee" strokeWidth="2"
                                 opacity="0.7" pointerEvents="none" />`;
              })}

              <!-- 齒輪 -->
              ${orderedGears.map(g => {
                const node = topo.nodes.get(g.id);
                return html`
                  <${GearView} key=${g.id}
                    gear=${g}
                    node=${node}
                    selected=${g.id === selectedId}
                    spinRpm=${effectiveRpm(node)}
                    clockwise=${node.ratio * dir > 0}
                    opts=${opts}
                    onPointerDown=${e => onGearPointerDown(e, g.id)}
                    registerRotor=${registerRotor}
                    crankMode=${mode === 'crank'}
                    shaking=${shakeId === g.id}
                    registerCounter=${registerCounter} />`;
              })}

              <!-- 嚙合接觸點 -->
              ${opts.showLinks && topo.links.filter(l => l.kind === 'mesh').map((l, i) => {
                const a = topo.byId.get(l.a), b = topo.byId.get(l.b);
                const t = radiusOf(a.teeth) / (radiusOf(a.teeth) + radiusOf(b.teeth));
                return html`<circle key=${`c${i}`} cx=${a.x + (b.x - a.x) * t} cy=${a.y + (b.y - a.y) * t} r="3"
                                    fill="#f8fafc" opacity="0.8" pointerEvents="none" />`;
              })}
            </svg>

            <!-- 左下角狀態列 -->
            <div className="absolute bottom-4 left-4 flex items-center gap-2 text-xs bg-slate-900/80 backdrop-blur border border-slate-700 rounded-lg px-3 py-2 pointer-events-none">
              <span className=${`px-2 py-0.5 rounded-full border font-semibold ${status.cls}`}>${status.label}</span>
              <span className="text-slate-400">齒輪 ${gears.length}</span>
              <span className="text-slate-600">|</span>
              <span className="text-slate-400">被帶動 ${drivenCount}</span>
              <span className="text-slate-600">|</span>
              <span className="text-slate-400">縮放 ${Math.round((1000 / view.w) * 100)}%</span>
              <span className="text-slate-600">|</span>
              <span className=${mode === 'crank' ? 'text-emerald-300 font-semibold' : 'text-slate-400'}>
                ${mode === 'crank' ? '手轉模式' : '移動模式'}
              </span>
            </div>

            <!-- 右側控制面板 -->
            <div className="absolute top-4 right-4 w-72 max-w-[calc(100%-2rem)] z-10 flex flex-col gap-3 max-h-[calc(100%-2rem)]">
              <button onClick=${() => setPanelOpen(o => !o)}
                      className="self-end flex items-center gap-1 text-xs px-3 py-1.5 bg-slate-900/90 border border-slate-700 rounded-full hover:bg-slate-800">
                控制面板 <${Icon} name=${panelOpen ? 'up' : 'down'} className="w-3.5 h-3.5" />
              </button>

              ${panelOpen && html`
                <div className="overflow-y-auto scrollbar-hide overscroll-contain flex flex-col gap-3 pr-0.5">
                  <${MotorPanel}
                    running=${running} setRunning=${setRunning}
                    dir=${dir} setDir=${setDir}
                    rpm=${rpm} setRpm=${setRpm}
                    motorFrozen=${motorFrozen} />

                  ${mode === 'crank' && html`
                    <${CrankPanel}
                      rows=${crankRows}
                      hasDriver=${hasDriver}
                      jammed=${crankJammed}
                      onReset=${resetCounters}
                      registerCell=${registerCell} />`}

                  ${selected && html`
                    <${GearInfoPanel}
                      gear=${selected}
                      node=${selectedNode}
                      chain=${chain}
                      rpm=${rpm}
                      dir=${dir}
                      effectiveRpm=${effectiveRpm(selectedNode)}
                      onClose=${() => setSelectedId(null)}
                      onTeeth=${t => setTeeth(selected.id, t)}
                      onToggleLayer=${() => toggleLayer(selected.id)}
                      onRemove=${() => removeGear(selected.id)} />`}

                  <${OptionsPanel} opts=${opts} setOpts=${setOpts} />
                </div>`}
            </div>
          </div>

          <!-- ========== 頁尾 ========== -->
          <${Footer} />

          <!-- ========== 說明視窗 ========== -->
          ${helpOpen && html`<${HelpDialog} onClose=${() => setHelpOpen(false)} />`}
        </div>`;
    }

    /* ============================================================
     * 15. 啟動
     * ============================================================ */
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
