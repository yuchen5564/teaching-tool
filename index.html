<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教學小工具</title>
<meta name="description" content="一系列打開瀏覽器就能用的互動式教學工具。">
<script>
  // 盡早套用已儲存的主題，避免載入時閃一下
  (() => {
    let t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    const root = document.documentElement;
    if (t === "light" || t === "dark") root.dataset.theme = t;
    const dark = t ? t === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
    root.classList.toggle("is-dark", dark);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #131317;
    --surface-2: #1a1a20;
    --border: #26262e;
    --text: #ededf0;
    --muted: #8b8b96;
    --faint: #5a5a64;
    --accent: #7c9cff;
    --grid: rgba(255,255,255,.035);
  }
  /* 淺色：手動切換 (data-theme="light") 或跟隨系統（未手動選擇時） */
  :root[data-theme="light"] {
    --bg: #f7f7f9; --surface: #ffffff; --surface-2: #f1f1f4; --border: #e3e3e8;
    --text: #16161a; --muted: #62626d; --faint: #9a9aa4; --accent: #3f63e0; --grid: rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f7f9; --surface: #ffffff; --surface-2: #f1f1f4; --border: #e3e3e8;
      --text: #16161a; --muted: #62626d; --faint: #9a9aa4; --accent: #3f63e0; --grid: rgba(0,0,0,.04);
    }
  }

  /* 深淺色切換按鈕 */
  .theme-toggle {
    position: absolute; top: 24px; right: 20px; z-index: 10;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    transition: color .2s, border-color .2s, transform .2s;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--accent); }
  .theme-toggle:active { transform: scale(.94); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle .sun { display: none; }
  :root.is-dark .theme-toggle .sun { display: block; }
  :root.is-dark .theme-toggle .moon { display: none; }
  body { transition: background-color .3s, color .3s; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: center top;
    color: var(--text);
    font-family: "Inter", "Noto Sans TC", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; position: relative; }

  /* ---------- Hero ---------- */
  header.hero { padding: 96px 0 48px; position: relative; }
  body::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 520px; z-index: -1;
    background: radial-gradient(700px 320px at 30% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);
    pointer-events: none;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--border); background: var(--surface);
    padding: 7px 12px; border-radius: 999px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84; }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
    margin: 22px 0 16px;
  }
  h1 .hl {
    background: linear-gradient(100deg, var(--accent), #c084fc 60%, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { color: var(--muted); font-size: 1.1rem; max-width: 560px; margin: 0; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 12px; margin: 40px 0 20px; flex-wrap: wrap; }
  .search {
    flex: 1 1 260px; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .search svg { flex: none; color: var(--faint); }
  .search input {
    flex: 1; min-width: 0; height: 46px; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 15px;
  }
  .search input::placeholder { color: var(--faint); }
  .count { font: 400 13px "JetBrains Mono", monospace; color: var(--faint); }

  /* ---------- Cards（樣式套用在自動生成的清單上） ---------- */
  .tools h2 {
    font: 500 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint); margin: 36px 0 12px;
  }
  ul.auto-links {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
  }
  ul.auto-links li {
    --hue: 230;
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 22px 18px; min-height: 140px;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
    opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  ul.auto-links li:hover {
    transform: translateY(-4px);
    border-color: hsl(var(--hue) 70% 60% / .55);
    box-shadow: 0 18px 40px -18px hsl(var(--hue) 80% 50% / .45);
  }
  ul.auto-links li::before { /* 圖示方塊 */
    content: attr(data-mono);
    display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 16px;
    border-radius: 12px; font-weight: 700; font-size: 18px; color: #fff;
    background: linear-gradient(135deg, hsl(var(--hue) 75% 58%), hsl(calc(var(--hue) + 40) 75% 52%));
  }
  ul.auto-links a {
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.08rem; line-height: 1.4;
  }
  ul.auto-links a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; } /* 整張卡片可點 */
  ul.auto-links a:focus-visible { outline: none; }
  ul.auto-links li:has(a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
  ul.auto-links .sub { display: block; color: var(--muted); font-size: .88rem; font-weight: 400; margin-top: 2px; }
  ul.auto-links small { display: block; color: var(--muted); font-size: .9rem; margin-top: 6px; }
  ul.auto-links br { display: none; }
  ul.auto-links code {
    order: 99; margin-top: auto; padding-top: 8px;
    font-size: 0; color: transparent; /* 隱藏檔名，只留箭頭 */
    display: flex; justify-content: flex-end; align-items: center;
  }
  ul.auto-links code::after { content: "→"; font-size: 15px; color: var(--faint); transition: transform .25s, color .25s; }
  ul.auto-links li:hover code::after { transform: translateX(4px); color: hsl(var(--hue) 75% 65%); }
  ul.auto-links li.hidden { display: none; }

  .empty { display: none; color: var(--muted); text-align: center; padding: 48px 0; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    ul.auto-links li { animation: none; opacity: 1; transition: none; }
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 80px; padding: 28px 0 40px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    color: var(--faint); font-size: 13px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 560px) {
    header.hero { padding-top: 64px; }
    ul.auto-links { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <button class="theme-toggle" id="theme" type="button" aria-label="切換深淺色" title="切換深淺色">
    <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <header class="hero">
    <span class="eyebrow"><span class="dot"></span>Interactive Teaching Lab</span>
    <h1>教學<span class="hl">小工具</span></h1>
    <p class="lead">一系列打開瀏覽器就能用的互動式教學頁面，不用安裝、不用登入，直接動手玩。</p>
  </header>

  <div class="toolbar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋工具…" autocomplete="off" aria-label="搜尋工具">
    </label>
    <span class="count" id="count"></span>
  </div>

  <main class="tools" id="tools">
<!-- AUTO-LINKS:START -->
<ul class="auto-links">
  <li><a href="bin.html">二進位加法模擬器</a> <code>bin.html</code></li>
  <li><a href="addcc.html">創用 CC 圖片授權標記工具</a> <code>addcc.html</code></li>
  <li><a href="ccbin.html">創用CC × 二進制探索器</a> <code>ccbin.html</code></li>
</ul>
<!-- AUTO-LINKS:END -->
    <p class="empty" id="empty">找不到符合的工具。</p>
  </main>

  <footer>
    <span>© <span id="year"></span> Merlin Kuo</span>
    <a href="https://github.com/yuchen5564/teaching-tool" target="_blank" rel="noopener">GitHub ↗</a>
  </footer>

</div>

<script>
(() => {
  const items = [...document.querySelectorAll("ul.auto-links li")];

  items.forEach((li, i) => {
    const a = li.querySelector("a");
    // 「中文標題 | English Subtitle」拆成主標題與副標題
    const parts = a.textContent.split(/\s*[|｜]\s*/);
    if (parts.length > 1) {
      a.textContent = parts[0];
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = parts.slice(1).join(" · ");
      a.after(sub);
    }
    // 圖示方塊：取標題第一個字；顏色依順序分散
    li.dataset.mono = [...parts[0].trim()][0] || "•";
    li.style.setProperty("--hue", (215 + i * 47) % 360);
    li.style.animationDelay = (i * 60) + "ms";
    li.dataset.search = li.textContent.toLowerCase();
  });

  const q = document.getElementById("q");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");
  const update = () => {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    items.forEach(li => {
      const hit = !term || li.dataset.search.includes(term);
      li.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    // 整組都被篩掉時，連同資料夾標題一起隱藏
    document.querySelectorAll("ul.auto-links").forEach(ul => {
      const h = ul.previousElementSibling;
      const any = ul.querySelector("li:not(.hidden)");
      ul.style.display = any ? "" : "none";
      if (h && h.tagName === "H2") h.style.display = any ? "" : "none";
    });
    count.textContent = term ? `${shown} / ${items.length} 個工具` : `${items.length} 個工具`;
    empty.style.display = shown ? "none" : "block";
  };
  q.addEventListener("input", update);
  update();

  document.getElementById("year").textContent = new Date().getFullYear();

  // 深淺色切換
  const root = document.documentElement;
  document.getElementById("theme").addEventListener("click", () => {
    const next = root.classList.contains("is-dark") ? "light" : "dark";
    root.dataset.theme = next;
    root.classList.toggle("is-dark", next === "dark");
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
})();
</script>
</body>
</html>
